<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spire Ledger — damage forecast</title>
<link rel="stylesheet" href="style.css">
<style>
  .shot { left: 900px; top: 262px; --x: 400; --y: 160; --w: 1100; --h: 920; --s: 0.8; }
  .zoom { left: 82px; top: 262px; --x: 534; --y: 280; --w: 208; --h: 106; --s: 2.95; }
  .panel { left: 80px; top: 600px; width: 614px; }
  .brand { left: 82px; right: auto; }
  .shot .num { position: absolute; }
</style>
</head>
<body>
  <div class="head"><h1 data-t="h1"></h1><p data-t="sub"></p></div>

  <div class="crop zoom"><img class="cap"></div>

  <div class="panel">
    <ul class="points">
      <li><span class="num">1</span><span data-t="p1"></span></li>
      <li><span class="num">2</span><span data-t="p2"></span></li>
      <li><span class="num">3</span><span data-t="p3"></span></li>
    </ul>
    <p class="note" data-t="note"></p>
  </div>

  <div class="crop shot"><img class="cap">
    <div class="ring" style="left:102px; top:90px; width:176px; height:96px"></div>
    <div class="ring" style="left:684px; top:272px; width:84px; height:72px"></div>
    <span class="num" style="left:780px; top:286px">1</span>
    <div class="ring" style="left:196px; top:630px; width:504px; height:110px"></div>
    <span class="num" style="left:150px; top:660px">2</span>
  </div>

  <div class="brand">SPIRE LEDGER</div>

<script>
  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr";
  const T = {
    fr: {
      h1: "Anticipez chaque point de vie perdu",
      sub: "Avant de finir votre tour, la prévision dit combien de PV vous allez perdre.",
      p1: "<b>Attaques ennemies</b>, moins votre armure",
      p2: "<b>Brûlures et malédictions</b> en main, poison, étreinte…",
      p3: "<b>PV max</b> perdus (Coupures de papier) et coups mortels signalés",
      note: "Placée au-dessus de votre personnage, sans cacher vos alliés. Touche V pour la masquer.",
    },
    en: {
      h1: "Know every HP you're about to lose",
      sub: "Before you end your turn, the forecast says how much HP you'll lose.",
      p1: "<b>Enemy attacks</b>, minus your Block",
      p2: "<b>Burns and curses</b> in hand, Poison, Constrict…",
      p3: "<b>Max HP loss</b> (Paper Cuts) and lethal hits flagged",
      note: "Sits above your character, never over your teammates. Press V to hide it.",
    },
  }[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => e.innerHTML = T[e.dataset.t]);
  document.querySelectorAll("img.cap").forEach(i => i.src = `../captures/${lang}/3_forecast.png`);
</script>
</body>
</html>
